<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOSHA ADMIN LOGIN</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080d18;color:white;font-family:Arial;padding:20px}
.card{width:100%;max-width:420px;background:#131e32;padding:30px;border-radius:20px;text-align:center}
h1{color:#45d6ff}
input{width:100%;padding:15px;margin:15px 0;border:1px solid #34445d;border-radius:10px;background:#080d18;color:white}
button{width:100%;padding:14px;background:#00c5eb;border:0;border-radius:10px;font-weight:bold}
.error{color:#ff6565}
</style>
</head>
<body>
<div class="card">
<h1>YOSHA LIVE</h1>
<h2>دخول المسؤول</h2>
<form method="POST" action="{{ url_for('login') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<input type="password" name="password" placeholder="كلمة مرور المسؤول" required autocomplete="current-password">
<button type="submit">تسجيل الدخول</button>
</form>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
</div>
</body>
</html>
